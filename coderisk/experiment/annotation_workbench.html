<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeRisk 数据盲审工作台</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#18212a}main{max-width:1400px;margin:auto;padding:24px}header,section{background:white;padding:20px;border:1px solid #dbe1e8;border-radius:10px;margin-bottom:16px}.notice{background:#fff4d9;padding:12px;line-height:1.7}input,select,textarea,button{font:inherit;padding:8px;margin:5px;border:1px solid #bac6d3;border-radius:5px}button{cursor:pointer;background:#175ca4;color:white}textarea{width:95%;min-height:100px}.codes{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111c2c;color:#e6edf6;padding:14px;max-height:540px;overflow:auto;line-height:1.6;font-size:13px}#identity{overflow-wrap:anywhere}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:800px){.codes{grid-template-columns:1fr}main{padding:10px}}</style></head>
<body><main><header><h1>CodeRisk 数据盲审工作台</h1><p class="notice">本页只用于确认研究样本关系，未展示检测分数或公开标签。源码只作为文本显示，不执行。不同文件、不同作者编号、同题或高相似均不足以证明正负例；缺少来源依据请选“不确定”。两位复核者应独立完成并分别导出。</p>
<div class="controls"><label>匿名复核者 ID <input id="reviewer" placeholder="如 REVIEWER-A"></label><label>语言 <select id="language"><option value="">全部</option><option>java</option><option>python</option><option>c</option><option>html</option></select></label><button id="export">导出本人的复核 JSON</button><span id="saved"></span></div></header>
<section><div class="controls"><button id="previous">上一对</button><select id="pair"></select><button id="next">下一对</button></div><p id="identity"></p><p id="functional"></p><div class="codes"><div><h2>源码 A</h2><pre id="codeA"></pre></div><div><h2>源码 B</h2><pre id="codeB"></pre></div></div></section>
<section><h2>本人的判断</h2><select id="label"><option value="UNCERTAIN">不确定／依据不足</option><option value="TRANSFORMED">有明确派生关系的改写</option><option value="SIMILAR">有记录的原文复制或重复版本</option><option value="INDEPENDENT">有独立创作依据</option><option value="NATURAL_SIMILAR">独立创作且共享模板／题目约束</option></select><p>填写具体来源、派生或独立依据，以及功能核验引用。仅凭代码外观无法确认独立创作。</p><textarea id="basis" placeholder="来源依据／共同模板／功能证据／疑问"></textarea><button id="save">保存这一对</button><p id="message" aria-live="polite"></p><p>保存仅保留在当前页面内存中，刷新或关闭会丢失。离开前务必导出 JSON；导出不等于完成正式标注。MDN 示例和 CodeNet 无关系标签，不得强行二分。</p></section></main>
<script>
const payload=/*REVIEW_PAYLOAD*/;
const byId=new Map(payload.rows.map(r=>[r.review_id,r]));let annotations=new Map(),visible=payload.rows;
const el=id=>document.getElementById(id);
function current(){return byId.get(el('pair').value)}
function show(){const r=current();if(!r)return;el('identity').textContent=`${r.review_id} · ${r.dataset} · ${r.problem_id} · ${r.language}`;el('functional').textContent=`功能证据 A：${r.functional_evidence_a}；B：${r.functional_evidence_b}`;el('codeA').textContent=r.code_a;el('codeB').textContent=r.code_b;const a=annotations.get(r.review_id);el('label').value=a?.label??'UNCERTAIN';el('basis').value=a?.basis??'';el('message').textContent='';}
function filter(){visible=payload.rows.filter(r=>!el('language').value||r.language===el('language').value);el('pair').replaceChildren(...visible.map((r,i)=>{let o=document.createElement('option');o.value=r.review_id;o.textContent=`${i+1}/${visible.length} ${r.review_id}`;return o}));show()}
el('language').onchange=filter;el('pair').onchange=show;
el('previous').onclick=()=>{el('pair').selectedIndex=Math.max(0,el('pair').selectedIndex-1);show()};el('next').onclick=()=>{el('pair').selectedIndex=Math.min(visible.length-1,el('pair').selectedIndex+1);show()};
el('save').onclick=()=>{const r=current();if(!r)return;if(!el('reviewer').value.trim()||!el('basis').value.trim()){el('message').textContent='请先填写匿名复核者 ID 和具体依据。';return;}el('reviewer').disabled=true;annotations.set(r.review_id,{review_id:r.review_id,hash_a:r.hash_a,hash_b:r.hash_b,label:el('label').value,basis:el('basis').value.trim(),reviewed_at:new Date().toISOString()});el('saved').textContent=`已保存 ${annotations.size}/${payload.rows.length} 对`;el('message').textContent='已保存到当前页面内存；复核者 ID 已锁定，离开前请导出。'};
el('export').onclick=()=>{if(!el('reviewer').value.trim()){el('message').textContent='请填写匿名复核者 ID。';return;}const data={schema_version:'coderisk-blind-review-1',manifest_sha256:payload.manifest_sha256,reviewer_id:el('reviewer').value.trim(),annotations:[...annotations.values()]};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='coderisk-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};filter();
</script></body></html>
