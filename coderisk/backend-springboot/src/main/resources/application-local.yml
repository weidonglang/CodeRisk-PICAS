spring:
  datasource:
    url: ${CODERISK_LOCAL_DB_URL:jdbc:h2:file:../data/db/coderisk-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
    username: sa
    password:
    driver-class-name: org.h2.Driver

coderisk:
  upload:
    root-path: ${CODERISK_UPLOAD_DIR:../data/uploads}
  artifacts:
    root-path: ${CODERISK_ARTIFACT_DIR:../data/artifacts}
