spring:
  datasource:
    url: jdbc:h2:mem:coderisk-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

coderisk:
  app-version: 0.1.0-test
  upload:
    root-path: target/test-uploads
    max-file-size-mb: 2
    allowed-extensions:
      - .html
      - .htm
      - .java
      - .py
      - .c
      - .cpp
  artifacts:
    root-path: target/test-artifacts
  analysis:
    base-url: http://localhost:8001
    timeout-seconds: 60
