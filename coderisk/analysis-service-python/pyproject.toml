[project]
name = "coderisk-analysis-service"
version = "0.1.0"
description = "FastAPI analysis service for CodeRisk / PICAS."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-html==0.23.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
