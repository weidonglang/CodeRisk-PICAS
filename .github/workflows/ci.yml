name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './coderisk/analysis-service-python[dev]'
      - run: python -m pytest -q
      - run: python -m pip install -r coderisk/experiment/requirements.txt
      - name: Validate fair evaluation and plotting on synthetic development data
        run: python coderisk/experiment/run_fair_evaluation.py --output .tmp/fair-ci --allow-development --skip-jplag

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coderisk/backend-springboot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: coderisk/backend-springboot/pom.xml
      - run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coderisk/frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coderisk/frontend-vue/package-lock.json
      - run: npm ci
      - run: npm run build
